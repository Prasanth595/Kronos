<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos - TradingView Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e1e1e;
            --secondary: #2e2e2e;
            --accent: #4a9eff;
            --success: #26a69a;
            --danger: #ef5350;
            --warning: #ffa500;
            --text: #e0e0e0;
            --border: #3a3a3a;
        }

        body {
            background: var(--primary);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .logo {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }

        .sidebar-section {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .symbol-search {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .symbol-search input {
            flex: 1;
            padding: 8px;
            background: var(--primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 12px;
        }

        .symbol-search button {
            padding: 8px 12px;
            background: var(--accent);
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .symbol-search button:hover {
            background: #3a8de0;
        }

        .watchlist-item {
            padding: 10px;
            margin: 5px 0;
            background: var(--primary);
            border-left: 3px solid transparent;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 13px;
        }

        .watchlist-item:hover {
            background: rgba(74, 158, 255, 0.1);
            border-left-color: var(--accent);
        }

        .watchlist-item.active {
            background: rgba(74, 158, 255, 0.2);
            border-left-color: var(--accent);
        }

        .watchlist-item-name {
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }

        .watchlist-item-price {
            font-size: 12px;
            color: #888;
        }

        .watchlist-item-change {
            font-size: 11px;
            margin-top: 3px;
        }

        .watchlist-item-change.positive {
            color: var(--success);
        }

        .watchlist-item-change.negative {
            color: var(--danger);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--secondary);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .symbol-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .symbol-name {
            font-size: 20px;
            font-weight: bold;
        }

        .symbol-stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
        }

        .stat {
            display: flex;
            gap: 5px;
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            font-weight: bold;
        }

        .timeframe-selector {
            display: flex;
            gap: 5px;
        }

        .timeframe-btn {
            padding: 8px 12px;
            background: var(--primary);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .timeframe-btn:hover {
            background: var(--border);
        }

        .timeframe-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Chart Area */
        .chart-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .chart {
            flex: 1;
            position: relative;
            background: var(--primary);
        }

        #chart {
            width: 100%;
            height: 100%;
        }

        /* Control Panel */
        .control-panel {
            background: var(--secondary);
            border-top: 1px solid var(--border);
            padding: 15px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 20px;
            min-height: 120px;
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
        }

        .control-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--text);
        }

        .control-slider {
            width: 100%;
            cursor: pointer;
        }

        .prediction-display {
            padding: 8px 12px;
            background: var(--primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prediction-display.bullish {
            border-color: var(--success);
        }

        .prediction-display.bearish {
            border-color: var(--danger);
        }

        /* Prediction Panel */
        .prediction-panel {
            background: var(--secondary);
            border-top: 1px solid var(--border);
            padding: 15px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .prediction-item {
            background: var(--primary);
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
        }

        .prediction-item-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .prediction-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 5px;
        }

        .prediction-confidence {
            font-size: 11px;
            color: #888;
        }

        .prediction-confidence.high {
            color: var(--success);
        }

        .prediction-confidence.medium {
            color: var(--warning);
        }

        .prediction-confidence.low {
            color: var(--danger);
        }

        /* Loading State */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 200px;
            }

            .control-panel {
                grid-template-columns: 1fr 1fr;
            }

            .prediction-panel {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 150px;
                display: flex;
                flex-direction: row;
                overflow-x: auto;
            }

            .sidebar-section {
                flex: 0 0 200px;
            }

            .control-panel,
            .prediction-panel {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">Kronos</div>

            <div class="sidebar-section">
                <h3>Search</h3>
                <div class="symbol-search">
                    <input type="text" id="symbolInput" placeholder="Search symbol...">
                    <button onclick="loadSymbol()">Go</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Watchlist</h3>
                <div id="watchlist" style="display: flex; flex-direction: column; gap: 5px;">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Settings</h3>
                <button onclick="toggleTheme()" style="width: 100%; padding: 8px; background: var(--primary); border: 1px solid var(--border); color: var(--text); cursor: pointer; border-radius: 4px;">
                    🌓 Toggle Theme
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="symbol-info">
                    <div class="symbol-name" id="symbolName">BTC/USDT</div>
                    <div class="symbol-stats">
                        <div class="stat">
                            <span class="stat-label">Price:</span>
                            <span class="stat-value" id="currentPrice">--</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Change:</span>
                            <span class="stat-value" id="priceChange">--</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">High:</span>
                            <span class="stat-value" id="dayHigh">--</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Low:</span>
                            <span class="stat-value" id="dayLow">--</span>
                        </div>
                    </div>
                </div>

                <div class="timeframe-selector">
                    <button class="timeframe-btn" onclick="setTimeframe('1m')">1M</button>
                    <button class="timeframe-btn" onclick="setTimeframe('5m')">5M</button>
                    <button class="timeframe-btn" onclick="setTimeframe('15m')">15M</button>
                    <button class="timeframe-btn" onclick="setTimeframe('1h')">1H</button>
                    <button class="timeframe-btn active" onclick="setTimeframe('4h')">4H</button>
                    <button class="timeframe-btn" onclick="setTimeframe('1d')">1D</button>
                    <button class="timeframe-btn" onclick="setTimeframe('1w')">1W</button>
                </div>
            </div>

            <!-- Chart -->
            <div class="chart-container">
                <div class="chart">
                    <div id="chart"></div>
                </div>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <div class="control-section">
                    <label class="control-label">Lookback Period</label>
                    <input type="range" class="control-slider" id="lookbackSlider" min="50" max="500" value="200" onchange="updateChart()">
                    <span class="control-value" id="lookbackValue">200</span>
                </div>

                <div class="control-section">
                    <label class="control-label">Prediction Length</label>
                    <input type="range" class="control-slider" id="predLenSlider" min="10" max="200" value="50" onchange="updateChart()">
                    <span class="control-value" id="predLenValue">50</span>
                </div>

                <div class="control-section">
                    <label class="control-label">Temperature (Sampling)</label>
                    <input type="range" class="control-slider" id="temperatureSlider" min="0.1" max="2" step="0.1" value="1" onchange="updateChart()">
                    <span class="control-value" id="temperatureValue">1.0</span>
                </div>

                <div class="control-section">
                    <label class="control-label">Model</label>
                    <select id="modelSelect" style="padding: 8px; background: var(--primary); border: 1px solid var(--border); color: var(--text); border-radius: 4px;">
                        <option value="kronos-mini">Kronos-mini</option>
                        <option value="kronos-small" selected>Kronos-small</option>
                        <option value="kronos-base">Kronos-base</option>
                    </select>
                </div>
            </div>

            <!-- Prediction Panel -->
            <div class="prediction-panel" id="predictionPanel" style="display: none;">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        let chart;
        let series;
        let currentSymbol = 'BTC/USDT';
        let currentTimeframe = '4h';
        let chartData = null;

        // Initialize chart
        function initChart() {
            const chartContainer = document.getElementById('chart');
            const width = chartContainer.clientWidth;
            const height = chartContainer.clientHeight;

            chart = LightweightCharts.createChart(chartContainer, {
                layout: {
                    background: { color: '#1e1e1e' },
                    textColor: '#e0e0e0',
                },
                width: width,
                height: height,
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                },
                grid: {
                    vertLines: { color: 'rgba(60, 60, 60, 0.2)' },
                    horzLines: { color: 'rgba(60, 60, 60, 0.2)' },
                },
            });

            series = chart.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderUpColor: '#26a69a',
                borderDownColor: '#ef5350',
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350',
            });

            // Add legend line for predictions
            chart.addLineSeries({
                color: '#4a9eff',
                lineWidth: 2,
                title: 'Kronos Prediction',
            });

            chart.timeScale().fitContent();

            // Handle window resize
            window.addEventListener('resize', () => {
                chart.applyOptions({
                    width: chartContainer.clientWidth,
                    height: chartContainer.clientHeight,
                });
            });
        }

        // Load and update chart
        async function updateChart() {
            const lookback = document.getElementById('lookbackSlider').value;
            const predLen = document.getElementById('predLenSlider').value;
            const temperature = document.getElementById('temperatureSlider').value;
            const model = document.getElementById('modelSelect').value;

            document.getElementById('lookbackValue').textContent = lookback;
            document.getElementById('predLenValue').textContent = predLen;
            document.getElementById('temperatureValue').textContent = temperature;

            try {
                const response = await axios.post('/api/predict', {
                    symbol: currentSymbol,
                    timeframe: currentTimeframe,
                    lookback: parseInt(lookback),
                    pred_len: parseInt(predLen),
                    temperature: parseFloat(temperature),
                    model: model,
                });

                if (response.data.success) {
                    const data = response.data.data;
                    
                    // Update chart with candlestick data
                    series.setData(data.historical);
                    
                    // Update predictions overlay
                    updatePredictions(data.predictions);
                    
                    // Update header stats
                    updateHeaderStats(data.stats);
                }
            } catch (error) {
                console.error('Error updating chart:', error);
            }
        }

        function updatePredictions(predictions) {
            const panel = document.getElementById('predictionPanel');
            let html = '';

            if (predictions && predictions.length > 0) {
                const pred = predictions[0]; // Get first prediction
                
                const trend = pred.close > predictions[0].close ? 'Bullish' : 'Bearish';
                const confidence = Math.random() * 100; // Placeholder
                
                html = `
                    <div class="prediction-item" style="border-left-color: ${trend === 'Bullish' ? '#26a69a' : '#ef5350'}">
                        <div class="prediction-item-title">Next Period Prediction</div>
                        <div class="prediction-value">
                            ${trend}
                            <span style="margin-left: 10px; font-size: 12px; color: #888;">Close: $${pred.close.toFixed(2)}</span>
                        </div>
                        <div class="prediction-confidence" style="color: ${confidence > 70 ? '#26a69a' : confidence > 40 ? '#ffa500' : '#ef5350'}">
                            Confidence: ${confidence.toFixed(1)}%
                        </div>
                    </div>

                    <div class="prediction-item">
                        <div class="prediction-item-title">Price Range</div>
                        <div class="prediction-value">
                            High: $${pred.high.toFixed(2)}
                        </div>
                        <div style="font-size: 12px; color: #888;">
                            Low: $${pred.low.toFixed(2)}
                        </div>
                    </div>

                    <div class="prediction-item">
                        <div class="prediction-item-title">Volume Forecast</div>
                        <div class="prediction-value">
                            ${(pred.volume / 1000000).toFixed(2)}M
                        </div>
                        <div style="font-size: 12px; color: #888;">
                            Expected volume
                        </div>
                    </div>

                    <div class="prediction-item">
                        <div class="prediction-item-title">Model Info</div>
                        <div style="font-size: 12px; color: #888;">
                            <div>Timeframe: ${currentTimeframe}</div>
                            <div>Lookback: ${document.getElementById('lookbackSlider').value} candles</div>
                        </div>
                    </div>
                `;

                panel.innerHTML = html;
                panel.style.display = 'grid';
            } else {
                panel.style.display = 'none';
            }
        }

        function updateHeaderStats(stats) {
            if (stats) {
                document.getElementById('currentPrice').textContent = `$${stats.currentPrice?.toFixed(2) || '--'}`;
                document.getElementById('priceChange').textContent = `${stats.change?.toFixed(2) || '--'}%`;
                document.getElementById('dayHigh').textContent = `$${stats.dayHigh?.toFixed(2) || '--'}`;
                document.getElementById('dayLow').textContent = `$${stats.dayLow?.toFixed(2) || '--'}`;
            }
        }

        function setTimeframe(timeframe) {
            currentTimeframe = timeframe;
            document.querySelectorAll('.timeframe-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateChart();
        }

        function loadSymbol() {
            const input = document.getElementById('symbolInput');
            if (input.value.trim()) {
                currentSymbol = input.value.trim().toUpperCase();
                document.getElementById('symbolName').textContent = currentSymbol;
                input.value = '';
                updateChart();
            }
        }

        function toggleTheme() {
            document.documentElement.style.filter = 
                document.documentElement.style.filter === 'invert(1)' ? 'invert(0)' : 'invert(1)';
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initChart();
            
            // Populate watchlist
            const watchlist = ['BTC/USDT', 'ETH/USDT', 'BNB/USDT', 'XRP/USDT', 'SOL/USDT'];
            const watchlistEl = document.getElementById('watchlist');
            watchlist.forEach(symbol => {
                const item = document.createElement('div');
                item.className = 'watchlist-item active';
                item.innerHTML = `
                    <span class="watchlist-item-name">${symbol}</span>
                    <span class="watchlist-item-price">$--</span>
                    <span class="watchlist-item-change positive">+2.45%</span>
                `;
                item.onclick = () => {
                    document.querySelectorAll('.watchlist-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    currentSymbol = symbol;
                    document.getElementById('symbolName').textContent = symbol;
                    updateChart();
                };
                watchlistEl.appendChild(item);
            });

            // Load initial chart
            updateChart();

            // Auto-update every 5 seconds
            setInterval(updateChart, 5000);
        });

        // Handle keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement.id === 'symbolInput') {
                loadSymbol();
            }
        });
    </script>
</body>
</html>
